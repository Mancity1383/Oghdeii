[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "oghdeii"
version = "0.2.0"
description = "Laptop chassis-tap shortcuts and optional voice control"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "sounddevice>=0.4.6,<1",
    "faster-whisper>=1.1,<2",
    "huggingface-hub>=0.21,<2",
    "PyQt6>=6.5,<7",
    "pynput>=1.7.6,<2",
    # v1m System-One intent classifier; when enabled, missing cloud decisions
    # block execution instead of silently falling back to local execution.
    "typesafe-sdk>=0.7,<1",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.6,<8",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]
build = ["pyinstaller>=6,<7"]
# Compatibility alias; base desktop dependencies are still installed.
cloud = ["typesafe-sdk>=0.7,<1"]

[project.scripts]
oghdeii = "main:main"

[tool.setuptools]
py-modules = [
    "main", "gui", "config_manager", "action_executor", "audio_engine",
    "tap_detector", "voice_detector", "whisper_voice_detector",
    "calibrate", "voice_calibrate", "tap_validate", "voice_validate",
]

[tool.setuptools.packages.find]
include = ["oghdeii*"]

[tool.setuptools.data-files]
"share/oghdeii" = ["VoiceRecognizerV1M.exe"]
"share/oghdeii/assets" = ["assets/icon.png", "assets/icon.ico"]

[tool.mypy]
# Third-party runtime dependencies that ship no type information; typesafe_sdk
# is typed (py.typed) and is therefore still checked strictly, as is this repo.
[[tool.mypy.overrides]]
module = ["pynput", "pynput.*", "sounddevice", "scipy", "scipy.*", "faster_whisper"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["."]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
